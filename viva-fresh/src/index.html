<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva Fresh App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Koka e App-it -->
    <header class="app-header">
        <div class="logo-area">
            <span class="brand-viva">Viva</span><span class="brand-fresh">Fresh</span>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Kërko produkte ose oferta...">
        </div>
    </header>

    <!-- Main Content / Përmbajtja -->
    <main class="app-container">
        
        <!-- Promo Banner -->
        <section class="promo-banner">
            <div class="banner-content">
                <h2>Zbritjet e Javës!</h2>
                <p>Eja dhe shfrytëzo ofertat më të mira në qytet.</p>
                <button class="btn-banner">Shiko Fletushkën</button>
            </div>
        </section>

        <!-- Categories / Kategoritë -->
        <section class="section-categories">
            <h3>Kategoritë</h3>
            <div class="categories-grid">
                <div class="category-card">🥦 Pemë & Perime</div>
                <div class="category-card">🥛 Produkte Qumështi</div>
                <div class="category-card">🥩 Mish freskët</div>
                <div class="category-card">🧼 Higjienë</div>
            </div>
        </section>

        <!-- Popular Products / Produktet Top -->
        <section class="section-products">
            <h3>Produkte në Ofertë</h3>
            <div class="products-grid">
                
                <!-- Produkti 1 -->
                <div class="product-card">
                    <div class="product-badge">Ofertë</div>
                    <div class="product-image-placeholder">📸</div>
                    <h4 class="product-title">Lëng Frutash 1L</h4>
                    <div class="product-price">
                        <span class="old-price">1.20€</span>
                        <span class="current-price">0.89€</span>
                    </div>
                    <button class="btn-add">Shto në shportë</button>
                </div>

                <!-- Produkti 2 -->
                <div class="product-card">
                    <div class="product-badge">Ofertë</div>
                    <div class="product-image-placeholder">📸</div>
                    <h4 class="product-title">Kafe e Bluajtur 500g</h4>
                    <div class="product-price">
                        <span class="old-price">4.50€</span>
                        <span class="current-price">3.49€</span>
                    </div>
                    <button class="btn-add">Shto në shportë</button>
                </div>

            </div>
        </section>

    </main>

    <!-- Navigation Bar / Menuja poshtë (E rëndësishme për Mobile) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">🏠 Ballina</a>
        <a href="#" class="nav-item">🏷️ Ofertat</a>
        <a href="#" class="nav-item">🛒 Shporta</a>
        <a href="#" class="nav-item">👤 Profili</a>
    </nav>

</body>
</html>
